[colors]
background  = #282828
foreground  = #d4be98
green       = #a9b665
blue        = #7daea3
yellow      = #d8a657
red         = #ea6962
pink        = #d3869b
teal        = #89b482
muted       = #7c6f64
focused     = #d4be98

[bar/main]
monitor          = ${env:MONITOR:}
width            = 100%
height           = 36
radius           = 0
background       = ${colors.background}
foreground       = ${colors.foreground}
padding-left     = 4
padding-right    = 4
module-margin    = 0

font-0 = "Iosevka Term:size=11;3"
font-1 = "Iosevka NF:size=13;3"
font-2 = "Iosevka NF:size=11;3"
font-3 = "Iosevka Term:size=9;3"

modules-left   = i3 spotify
modules-center = date
modules-right  = uptime sep backlight sep pulseaudio sep battery sep network sep cpu sep memory tray

cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc    = true

; ── Separator ─────────────────────────────────────────────

[module/sep]
type              = custom/text
format            = |
format-foreground = ${colors.muted}
format-padding    = 1

; ── Left ──────────────────────────────────────────────────

[module/i3]
type                        = internal/i3
strip-wsnumbers             = false
index-sort                  = true
wrapping-scroll             = false
format                      = <label-state>
label-focused               = %name%
label-focused-foreground    = ${colors.green}
label-focused-padding       = 2
label-unfocused             = %name%
label-unfocused-foreground  = ${colors.muted}
label-unfocused-padding     = 2
label-unfocused-font        = 4
label-urgent                = %name%
label-urgent-foreground     = ${colors.red}
label-urgent-padding        = 2

[module/xwindow]
type              = internal/xwindow
label             = %title:0:50:...%
label-foreground  = ${colors.muted}

[module/spotify]
type         = custom/script
exec         = ~/.config/polybar/scripts/spotify-status.sh
interval     = 2
click-left   = playerctl --player=spotify play-pause
click-right  = playerctl --player=spotify next
click-middle = playerctl --player=spotify previous

; ── Center ────────────────────────────────────────────────

[module/date]
type       = internal/date
interval   = 1
date       = %H:%M:%S
date-alt   = %A, %d %B %Y
label      = %{T2}󰔛%{T-} %date%
label-foreground = ${colors.foreground}
click-left = i3-msg exec "alacritty -e calcurse" &

; ── Right ─────────────────────────────────────────────────

[module/uptime]
type     = custom/script
exec     = ~/.config/polybar/scripts/uptime-short.sh
interval = 60
label    = %{T2}󰔚%{T-} %output%
label-foreground = ${colors.muted}

[module/backlight]
type              = internal/backlight
card              = intel_backlight
enable-scroll     = true
format            = <ramp> <label>
label             = %percentage%%
ramp-0            = %{T2}󰃞%{T-}
ramp-1            = %{T2}󰃟%{T-}
ramp-2            = %{T2}󰃠%{T-}
ramp-0-foreground = ${colors.yellow}
ramp-1-foreground = ${colors.yellow}
ramp-2-foreground = ${colors.yellow}

[module/pulseaudio]
type                   = internal/pulseaudio
format-volume          = <ramp-volume> <label-volume>
label-volume           = %percentage%%
label-muted            = %{T2}󰖁%{T-} muted
label-muted-foreground = ${colors.muted}
ramp-volume-0          = %{T2}%{T-}
ramp-volume-1          = %{T2}%{T-}
ramp-volume-2          = %{T2}%{T-}
ramp-volume-0-foreground = ${colors.blue}
ramp-volume-1-foreground = ${colors.blue}
ramp-volume-2-foreground = ${colors.blue}
click-right            = pamixer -t
scroll-up              = pamixer -i 2
scroll-down            = pamixer -d 2
click-middle           = pavucontrol &

[module/battery]
type                        = internal/battery
full-at                     = 95
battery                     = BAT0
adapter                     = AC
poll-interval               = 5
format-charging             = <animation-charging> <label-charging>
format-discharging          = <ramp-capacity> <label-discharging>
format-full                 = %{T2}󰁹%{T-} <label-full>
label-charging              = %percentage%%
label-discharging           = %percentage%%
label-full                  = Full
label-full-foreground       = ${colors.green}
ramp-capacity-0             = %{T2}󰁺%{T-}
ramp-capacity-1             = %{T2}󰁻%{T-}
ramp-capacity-2             = %{T2}󰁼%{T-}
ramp-capacity-3             = %{T2}󰁽%{T-}
ramp-capacity-4             = %{T2}󰁾%{T-}
ramp-capacity-5             = %{T2}󰁿%{T-}
ramp-capacity-6             = %{T2}󰂀%{T-}
ramp-capacity-7             = %{T2}󰂁%{T-}
ramp-capacity-8             = %{T2}󰂂%{T-}
ramp-capacity-9             = %{T2}󰁹%{T-}
ramp-capacity-0-foreground  = ${colors.red}
ramp-capacity-1-foreground  = ${colors.red}
ramp-capacity-2-foreground  = ${colors.yellow}
ramp-capacity-3-foreground  = ${colors.yellow}
ramp-capacity-4-foreground  = ${colors.yellow}
ramp-capacity-5-foreground  = ${colors.green}
ramp-capacity-6-foreground  = ${colors.green}
ramp-capacity-7-foreground  = ${colors.green}
ramp-capacity-8-foreground  = ${colors.green}
ramp-capacity-9-foreground  = ${colors.green}
animation-charging-0        = %{T2}󰢜%{T-}
animation-charging-1        = %{T2}󰂆%{T-}
animation-charging-2        = %{T2}󰂇%{T-}
animation-charging-3        = %{T2}󰂈%{T-}
animation-charging-4        = %{T2}󰂅%{T-}
animation-charging-framerate = 750
animation-charging-0-foreground = ${colors.yellow}
animation-charging-4-foreground = ${colors.green}

[module/network]
type         = custom/script
exec         = ~/.config/polybar/scripts/network-info.sh
interval     = 5
click-left   = nm-connection-editor &

[module/cpu]
type             = internal/cpu
interval         = 1
format-prefix    = "%{T2}󰻠%{T-} "
format-prefix-foreground = ${colors.blue}
label            = %percentage:2%%
click-left       = alacritty -e btop &

[module/memory]
type             = internal/memory
interval         = 2
format-prefix    = "%{T2}󰍛%{T-} "
format-prefix-foreground = ${colors.blue}
label            = %percentage_used:2%%
click-left       = alacritty -e btop &

[module/tray]
type         = internal/tray
tray-spacing = 8

[settings]
screenchange-reload = true
pseudo-transparency = true
