[general]
live_config_reload = true
working_directory = "None"

# Themes --
import = [
  "~/.config/alacritty/alacritty-wal.toml",
  "~/.config/alacritty/keybinds.toml"
]

[window]
title = "Alacritty"
decorations = "none"
blur = true
# opacity = 0.7
padding.x = 10
padding.y = 10

[window.dimensions]
columns = 160
lines = 24

[font]
normal = { family = "Iosevka" }
size = 8.0
