<touchégg>
  <settings>
    <property name="animation_delay">0</property>
    <property name="action_execute_threshold">6</property>
    <property name="color">9ece6a</property>
    <property name="borderColor">1a1b26</property>
  </settings>

  <application name="All">
    <!-- Three-finger horizontal swipes switch i3 workspaces.
         Swipe left moves forward, swipe right moves back. -->
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Super_L</modifiers>
        <keys>Page_Down</keys>
        <on>begin</on>
        <animate>false</animate>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Super_L</modifiers>
        <keys>Page_Up</keys>
        <on>begin</on>
        <animate>false</animate>
      </action>
    </gesture>

    <!-- X11 apps such as Brave do not receive native pinch zoom reliably.
         Touchégg converts the gesture into the standard Ctrl+plus/minus zoom shortcuts. -->
    <gesture type="PINCH" fingers="2" direction="OUT">
      <action type="SEND_KEYS">
        <repeat>true</repeat>
        <modifiers>Control_L</modifiers>
        <keys>KP_Add</keys>
        <decreaseKeys>KP_Subtract</decreaseKeys>
        <animate>false</animate>
      </action>
    </gesture>

    <gesture type="PINCH" fingers="2" direction="IN">
      <action type="SEND_KEYS">
        <repeat>true</repeat>
        <modifiers>Control_L</modifiers>
        <keys>KP_Subtract</keys>
        <decreaseKeys>KP_Add</decreaseKeys>
        <animate>false</animate>
      </action>
    </gesture>
  </application>
</touchégg>
